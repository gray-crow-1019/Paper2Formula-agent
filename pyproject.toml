[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2formula"
version = "0.1.0"
description = "Evidence-grounded paper equation analysis and review"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic-settings==2.9.1",
  "python-multipart==0.0.20", "SQLAlchemy==2.0.40", "PyMuPDF==1.25.5",
  "httpx==0.28.1", "langgraph==1.0.3", "langgraph-checkpoint-sqlite==3.0.1",
  "langgraph-checkpoint-postgres==3.0.1", "psycopg[binary,pool]==3.2.9",
  "celery==5.5.2", "redis==5.2.1", "boto3==1.38.23", "mcp==1.28.0",
  "PyJWT==2.10.1", "sympy==1.14.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.10"]
docling = ["docling==2.58.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
